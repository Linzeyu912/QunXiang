# 生产环境 Docker Compose
# 用法：POSTGRES_PASSWORD=xxx docker compose -f docker-compose.prod.yml up -d

services:
  caddy:
    image: caddy:2-alpine
    container_name: qunxiang-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - web
    restart: unless-stopped
    networks:
      - qunxiang-net

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: qunxiang-api
    env_file:
      - api/.env.production
    environment:
      # postgres 密码从环境变量注入（compose 会合并 env_file 和 environment）
      DATABASE_URL: postgresql://qunxiang:${POSTGRES_PASSWORD}@postgres:5432/qunxiang
      DIRECT_DATABASE_URL: postgresql://qunxiang:${POSTGRES_PASSWORD}@postgres:5432/qunxiang
      QUNXIANG_CONFIG_DIR: /app/config
      LLM_DISABLE_THINKING: "true"
    volumes:
      - object-data:/app/storage/objects
      - llm-config-data:/app/config
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - qunxiang-net

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: qunxiang-web
    restart: unless-stopped
    networks:
      - qunxiang-net

  postgres:
    image: postgres:15-alpine
    container_name: qunxiang-postgres
    environment:
      POSTGRES_DB: qunxiang
      POSTGRES_USER: qunxiang
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qunxiang -d qunxiang"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qunxiang-net

volumes:
  postgres-data:
  object-data:
  llm-config-data:
  caddy-data:
  caddy-config:

networks:
  qunxiang-net:
    driver: bridge
