services:
  postgres-test:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: qunxiang_test
      POSTGRES_USER: qunxiang_test
      POSTGRES_PASSWORD: qunxiang_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qunxiang_test -d qunxiang_test"]
      interval: 2s
      timeout: 2s
      retries: 30

  minio-test:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: qunxiang_test
      MINIO_ROOT_PASSWORD: qunxiang_test
    ports:
      - "9000:9000"
      - "9001:9001"
